<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FLAC Web Player</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="manifest" href="/manifest.json">
  <!-- music-metadata-browser for reading FLAC tags in browser -->
  <script src="https://unpkg.com/music-metadata-browser/dist/music-metadata-browser.min.js"></script>
</head>
<body>
  <div id="app" class="container">
    <header>
      <h1>FLAC Web Player — MVP</h1>
      <div class="controls-row">
        <input id="fileInput" type="file" accept="audio/*" multiple />
        <button id="btnDropHint">Drag & drop files here</button>
        <button id="themeToggle">🌓</button>
      </div>
    </header>

    <main>
      <section class="player">
        <div class="now-playing">
          <img id="cover" alt="cover" src="" />
          <div class="meta">
            <div id="title">—</div>
            <div id="artist">—</div>
            <div id="album">—</div>
          </div>
        </div>

        <div class="transport">
          <div class="buttons">
            <button id="prev">⏮</button>
            <button id="play">▶</button>
            <button id="next">⏭</button>
            <button id="shuffle">🔀</button>
            <button id="repeat">🔁</button>
          </div>

          <div class="seek-row">
            <span id="currentTime">0:00</span>
            <input id="seek" type="range" min="0" max="100" value="0">
            <span id="duration">0:00</span>
          </div>

          <div class="misc">
            <label>Vol <input id="volume" type="range" min="0" max="1" step="0.01" value="1"></label>
            <label>Speed <input id="playbackRate" type="range" min="0.5" max="2" step="0.05" value="1"></label>
            <label>Crossfade <input id="crossfade" type="range" min="0" max="10" step="0.5" value="0"></label>
          </div>
        </div>

        <canvas id="visualizer"></canvas>

        <div id="eqPanel" class="eq-panel">
          <h4>Equalizer</h4>
          <div class="eq-sliders"></div>
        </div>
      </section>

      <aside class="playlist">
        <h2>Playlist</h2>
        <div class="playlist-controls">
          <button id="exportPlaylist">Export</button>
          <button id="importBtn">Import</button>
          <input id="importInput" type="file" accept="application/json" style="display:none">
          <button id="clearPlaylist">Clear</button>
        </div>
          <div class="playlist-manage">
            <label for="savePlaylistName">Save as</label>
            <input id="savePlaylistName" type="text" placeholder="My playlist" />
            <button id="savePlaylist">Save</button>
            <h3>Saved Playlists</h3>
            <ul id="savedPlaylists"></ul>
          </div>
          <ul id="playlist" aria-label="Current playlist"></ul>
      </aside>
    </main>

    <footer>
      <small>Local-only player. FLAC playback depends on browser support.</small>
    </footer>
  </div>

  <script src="assets/player.js"></script>
  <script>
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
    }
  </script>
</body>
</html>
